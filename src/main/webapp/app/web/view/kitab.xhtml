<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/frontpage.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets" 
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces"
                xmlns:pe="primefaces.extensions"> 

    <f:metadata>
        <ui:param name="brand" value="#{config.getString('web.websiteName')}" />
        <ui:param name="description" value="#{config.getString('web.firstSlogan')}" />
        <f:viewParam name="k" value="#{page.activeKajianId}" />
    </f:metadata>

    <ui:define name="content">

        <style>

            .ui-accordion-header {
                margin-top: .5rem!important;
                background-color: white!important;
                border-top: none!important;
                border-left: none!important;
                border-right: none!important;
                border-radius: 1em;
            }
            .ui-accordion-content {
                padding: 0!important;
            }
        </style>

        <div class="card my-4" style="background-color: var(--md-ref-palette-primary90)">
            <div class="card-header bg-transparent text-center border-0">
                <h:outputText class="d-block fw-bold primary-text h2" value="Kitab Kajian" />
                <c:if test="#{page.activeKajianId ne 'null'}">
                    <span class="d-block fw-bold primary-text h4">#{page.kajian.title}</span>
                </c:if>
            </div>
            <div class="card-body p-2 border-0">

                <c:if test="#{page.activeKajianId ne 'null'}">
                    <h:form prependId="false" id="content" >
                        <p:accordionPanel value="#{page.kitab}" var="kitab" activeIndex="-1">
                            <p:tab title="#{kitab.title}" class="mb-2">
                                <pe:documentViewer height="500" url="/api/videokajian/kitab/#{kitab.id}" zoom="page-width" />
                            </p:tab>
                        </p:accordionPanel>
                    </h:form>
                </c:if>

                <c:if test="#{page.activeKajianId eq 'null'}">            
                    <h:form>
                        <ul class="list-group">
                            <ui:repeat value="#{kajianRetriever.kajianWithKitab}" var="kajian">
                                <li class="list-group-item list-group-item-action border-0 mb-2">
                                    <ui:include src="/WEB-INF/components/app/web/view/card-kajian-with-kitab-v.xhtml">
                                        <ui:param name="kajian" value="#{kajian}" />
                                    </ui:include>
                                </li>
                            </ui:repeat>
                        </ul>
                    </h:form>
                </c:if>
            </div>
        </div>       

    </ui:define>

</ui:composition>
