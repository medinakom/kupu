<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Kitab" />
        <ui:param name="viewPage" value="#{kitabEditorPage}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="notool" value="true" />
        <ui:param name="nofilter" value="true"/>          

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="KitabConverter" transient="true" />
        <f:viewParam name="kajian" value="#{viewPage.kajian}" converter="KajianConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/web/module-menu.xhtml" />
    </ui:define>

    <ui:define name="content-header" />

    <ui:define name="form">

        <div class="grid w-full p-3">
            <div class="col-12 md:col-6 md:col-offset-3">
                <ui:decorate template="/WEB-INF/components/core/base/formlet.xhtml">
                    <ui:define name="fields">
                        <div class="form-field">
                            <p:outputLabel for="title" value="Judul" />
                            <p:inputText id="title" class="block w-100" required="true"
                                         value="#{viewPage.entity.title}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="author" value="Penulis" />
                            <p:inputTextarea id="author" class="form-control"
                                             value="#{viewPage.entity.author}" />
                        </div>
                    </ui:define>
                </ui:decorate>
            </div>
        </div>
    </ui:define>

</ui:composition>
