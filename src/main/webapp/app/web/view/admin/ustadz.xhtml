<ui:decorate xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             template="/WEB-INF/templates/page.xhtml"
             xmlns:p="primefaces"
             xmlns:f="jakarta.faces.core"
             xmlns:h="jakarta.faces.html">

    <f:metadata>
        <ui:param name="title" value="Ustadz" />

        <ui:param name="viewPage" value="#{ustadzPage}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="dataView" value="#{viewPage.ustadzList}" />
        <ui:param name="contentId" value=":data-frm:#{dataView.name}" />  
        <ui:param name="notool" value="true" />

        <ui:param name="filter" value="#{dataView.filter}" />
        <ui:param name="filterType" value="overlay" />
        <ui:param name="filterUi" value="/WEB-INF/components/core/common/common-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/core/common/meta/common-filterui.xhtml" /> 

        <ui:param name="sorter" value="#{dataView.sorter}" />
        <ui:include src="/WEB-INF/components/core/base/meta/sorter.xhtml" />

        <ui:param name="pager" value="#{dataView.pager}" />
        <ui:include src="/WEB-INF/components/core/base/meta/pager.xhtml" />

        <f:viewParam name="s" value="#{dataView.selectionsInternal}" 
                     converter="UstadzListConverter" transient="true" />
    </f:metadata>

    <ui:define name="parent-nav">
        <p:commandButton action="#{webNavigator.open('Home', '')}" class="ui-button-flat"
                         immediate="true" ajax="false" icon="pi pi-home" />
    </ui:define>

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/web/module-menu.xhtml" />
    </ui:define>

    <ui:define name="content">
        <h:form id="data-frm" class="flex-grow-1 flex align-items-stretch">
            <ui:decorate template="/WEB-INF/components/core/base/table.xhtml" >
                <ui:define name="columns">
                    <p:column headerText="Internal Reference">
                        <h:outputText value="#{data.id}" />
                    </p:column>

                    <p:column headerText="Nama">
                        <h:outputText value="#{data.fullname}" />
                    </p:column>
                </ui:define>
            </ui:decorate>
        </h:form>
    </ui:define>

</ui:decorate>
