<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/child-page.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Video" />

        <ui:param name="viewPage" value="#{videoEditorPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <f:viewParam name="v" value="#{viewPage.videoKajian}" converter="VideoKajianConverter" transient="true" />
        <f:viewAction action="#{videoEditorPage.load}" />
    </f:metadata>

    <ui:define name="styles">
        <h:outputStylesheet library="css" name="video-js.css" />
        <h:outputStylesheet library="css" name="plyr.css" />
        <style>
            .ratio{
                position:relative;
                width:100%
            }
            .ratio::before{
                display:block;
                padding-top:var(--bs-aspect-ratio);
                content:""
            }
            .ratio>*{
                position:absolute;
                top:0;
                left:0;
                width:100%;
                height:100%
            }
            .ratio-1x1{
                --bs-aspect-ratio:100%
            }
            .ratio-4x3{
                --bs-aspect-ratio:calc(3 / 4 * 100%)
            }
            .ratio-16x9{
                --bs-aspect-ratio:calc(9 / 16 * 100%)
            }
            .ratio-21x9{
                --bs-aspect-ratio:calc(9 / 21 * 100%)
            }
            .plyr__controls {
                box-shadow: none!important;
                border: none!important;
            }
            .ui-blockui-content {
                padding: 0!important;
            }
        </style>
    </ui:define>
    
    <ui:define name="crud-tools" />

    <ui:define name="jscript">
        <h:outputScript library="js" name="video.js" />
        <h:outputScript library="js" name="videojs-http-streaming.js" />

        <h:outputScript library="js" name="plyr.js" />
        <h:outputScript library="js" name="hls.js" />
    </ui:define>

    <ui:define name="tools">        
        <p:commandButton icon="pi pi-upload" class="ui-button-flat" immediate="true"
                         oncomplete="PF('uploadDlg').show()"
                         title="Upload video dari file di komputer lokal" />
        <p:commandButton icon="pi pi-youtube" class="ui-button-flat" immediate="true"
                         onclick="PF('youtubeDownloadDlg').show()"
                         title="Upload video dari link Youtube" />
        <p:commandButton icon="pi pi-external-link" class="ui-button-flat" immediate="true"
                         onclick="PF('internalUploadDlg').show()"
                         title="Upload video dari file di server" />
    </ui:define>

    <ui:define name="other-nonview">

        <h:form>

            <p:poll interval="1" listener="#{viewPage.checkVideoCompleteness}"
                    autoStart="false" widgetVar="vPoll"  />

            <p:poll interval="1" listener="#{viewPage.checkAudioCompleteness}"
                    autoStart="false" widgetVar="aPoll"  />

        </h:form>

    </ui:define>

    <ui:define name="content">
        <div class="grid p-4"> 
            <div class="col-12 mb-4">
                <h:outputText class="text-xl" value="#{viewPage.videoKajian.kajian.title} - #{viewPage.videoKajian.notes}" />
            </div>
            <h:form id="v-frm" class="block col-6 grid border-1 surface-border">
                <div class="col-12 ratio ratio-16x9">
                    <video-js id="v-preview" class="vjs-lo-skin"
                              style="position:absolute; top:0;" controls="true" autoplay="false"
                              preload="metadata">
                        <source src="/api/videokajian/#{viewPage.videoKajian.id}/stream" type="application/x-mpegURL" />
                    </video-js>
                    <script>
                        var player1 = videojs('#v-preview');
                        var reloadVideo = function () {
                            player1.src(
                                    {
                                        src: player1.currentSrc(),
                                        type: 'application/x-mpegURL'
                                    }
                            );
                        };
                        reloadVideo();
                    </script>
                </div>
                <div class="col-12 pt-3 text-center" >
                    <p:commandButton icon="pi pi-wrench" class="rounded-button ml-2"
                                     immediate="true"
                                     actionListener="#{viewPage.generateVideo}" />
                    <p:commandButton icon="pi pi-trash" class="rounded-button ui-button-warning ml-2"
                                     immediate="true"
                                     oncomplete="PF('deleteVideoContentConfirm').show()" />
                </div>
            </h:form>
            <p:blockUI id="v-blocker" block="v-frm" widgetVar="vBlocker">
                <div class="flex-column align-items-center p-4 bg-white">
                    <p:progressBar styleClass="w-full" displayOnly="true" mode="indetermined"  />
                    <h:outputText value="Sedang memproses..." />
                </div>
            </p:blockUI>
            <div class="col-5 col-offset-1 grid p-2 border-1 surface-border align-items-center">                
                <h:form id="a-frm">
                    <div class="border-1 surface-border">
                        <audio id="a-preview" controls="true" preload="true" />
                        <script>
                            var audio = document.querySelector('#a-preview');
                            var audioPlay = function () {

                                if (Hls.isSupported()) {
                                    var hls = new Hls();

                                    hls.loadSource('/api/audiokajian/#{viewPage.videoKajian.id}/stream');
                                    hls.attachMedia(audio);
                                }

                                plyr.setup(audio);
                            };
                            audioPlay();
                            var reloadAudio = function () {
                                if (Hls.isSupported()) {
                                    var hls = new Hls();

                                    hls.loadSource('/api/audiokajian/#{viewPage.videoKajian.id}/stream');
                                    hls.attachMedia(audio);
                                }
                            };
                        </script>
                    </div>
                    <div class="text-center border-left-1 border-right-1 border-bottom-1 surface-border py-3">
                        <p:commandButton icon="pi pi-wrench" class="rounded-button ml-2"
                                         actionListener="#{viewPage.generateAudio}" 
                                         immediate="true" />
                        <p:commandButton icon="pi pi-trash" class="rounded-button ui-button-warning ml-2"
                                         oncomplete="PF('deleteAudioContentConfirm').show()"
                                         immediate="true" />
                    </div>
                </h:form>
                <p:blockUI id="a-blocker" block="a-frm" widgetVar="aBlocker"  >
                    <div class="flex-column align-items-center p-4 bg-white">
                        <p:progressBar styleClass="w-full" displayOnly="true" mode="indetermined"  />
                        <h:outputText value="Sedang memproses..." />
                    </div>
                </p:blockUI>
            </div>
        </div>

        <p:confirmDialog id="delete-videocontent-confirm" header="Hapus Video"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteVideoContentConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus video ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteAudioContentConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{viewPage.clearVideo}"
                                         onclick="PF('deleteVideoContentConfirm').hide()"
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:confirmDialog id="delete-audiocontent-confirm" header="Hapus Audio"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteAudioContentConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus audio ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteAudioContentConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{viewPage.clearAudio}"
                                         onclick="PF('deleteAudioContentConfirm').hide()"
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>   

        <p:dialog id="upload-dlg" widgetVar="uploadDlg" dynamic="true" modal="true" closable="true" header="Upload Video">
            <h:form enctype="multipart/form-data">
                <p:fileUpload mode="advanced" accept="/(\.|\/)(mp4)$/"
                              listener="#{viewPage.handleFileUpload}"
                              oncomplete="PF('uploadDlg').hide()" />
            </h:form>
        </p:dialog>     

        <p:dialog id="yt-dl-dlg" widgetVar="youtubeDownloadDlg" dynamic="true"
                  modal="true" positionType="absolute" 
                  header="Link Video" >
            <h:form id="yt-dl-frm">
                <div>
                    <div class="form-group">
                        <p:outputLabel for="url" value="URL" />
                        <p:inputTextarea id="url" class="form-control"
                                         value="#{viewPage.youtubeUrl}" />
                    </div>
                </div>
                <div>
                    <div class="d-flex justify-content-end">
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Mulai" actionListener="#{viewPage.handleYtUpload}"
                                         onclick="PF('youtubeDownloadDlg').hide()"
                                         update=":messages" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>        

        <p:dialog id="internal-upload-dlg" widgetVar="internalUploadDlg"
                  header="Internal Upload" dynamic="true" modal="true" positionType="absolute" >
            <h:form id="internal-upload-frm">
                <div>

                    <div class="form-group">
                        <p:outputLabel for="path" value="Path" />
                        <p:inputTextarea id="path" class="form-control"
                                         value="#{viewPage.internalPath}" />
                    </div>
                </div>
                <div>
                    <div class="d-flex justify-content-end">
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Mulai" actionListener="#{viewPage.handleInternalUpload}"
                                         onclick="PF('internalUploadDlg').hide()"
                                         update=":messages" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>
        
    </ui:define>

</ui:composition>
