<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Kajian" />
        <ui:param name="viewPage" value="#{ustadzEditorPage}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="notool" value="true" />
        <ui:param name="nofilter" value="true"/>          

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="UstadzConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/web/module-menu.xhtml" />
    </ui:define>

    <ui:define name="content-header" />

    <ui:define name="form">
        <div class="grid w-full p-3">
            <div class="col-12 md:col-6 md:col-offset-3">
                <ui:decorate template="/WEB-INF/components/core/base/formlet.xhtml">
                    <ui:define name="fields">
                        <div class="form-field">
                            <p:outputLabel for="title-prefix" value="Title (prefix)" />
                            <p:inputText id="title-prefix" class="form-control"
                                         value="#{viewPage.entity.prefixTitle}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="name" value="Name" />
                            <p:inputText id="name" class="form-control" required="true"
                                         value="#{viewPage.entity.name}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="title-suffix" value="Title (suffix)" />
                            <p:inputText id="title-suffix" class="form-control"
                                         value="#{viewPage.entity.suffixTitle}" />
                        </div>
                    </ui:define>
                </ui:decorate>
            </div>
        </div>
    </ui:define>

</ui:composition>
