<ui:decorate xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             template="/WEB-INF/templates/admin/admin-lte.xhtml"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <f:metadata>
        <ui:param name="brand" value="#{config.getString('application.websiteName')}" />
        <ui:param name="description" value="#{config.getString('application.firstSlogan')}" />
        <ui:param name="pageTitle" value="Category" />
        <ui:param name="leftSidebarContent" value="/WEB-INF/components/alhiqniy/main-menu.xhtml" />
        <f:viewParam name="m" value="#{adminPage.menu}" />
    </f:metadata>

    <ui:define name="main-content">
        <div class="row">                        
            <div class="col-12">
                <nav class="navbar navbar-white navbar-light border" > 
                    <div class="navbar-brand mb-0">List of Category</div>
                    <h:form id="tools-frm" class="ml-auto">
                        <p:commandButton icon="pi pi-plus" class="ui-button-primary ml-2"
                                         immediate="true" actionListener="#{contentCategoryPage.onCreateData}" 
                                         oncomplete="PF('createDataDlg').show()" 
                                         update=":create-data-dlg" />
                        <p:commandButton icon="pi pi-pencil" class="ui-button-secondary ml-2"
                                         immediate="true" actionListener="#{contentCategoryPage.onEditData}" 
                                         oncomplete="PF('createDataDlg').show()" 
                                         update=":create-data-dlg"                                        
                                         disabled="#{contentCategoryPage.selection eq null}" />
                        <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                         immediate="true" update=":delete-data-confirm" 
                                         oncomplete="PF('deleteDataConfirm').show()"                                         
                                         disabled="#{contentCategoryPage.selection eq null}" />
                    </h:form>
                </nav>

                <h:form id="data-frm">
                    <p:dataTable id="data-tbl" var="data" value="#{contentCategoryPage.model}" 
                                 paginator="true" rows="10" paginatorPosition="bottom" lazy="true"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 selectionMode="single" selection="#{contentCategoryPage.selection}" paginatorAlwaysVisible="false"
                                 stripedRows="true" class="border-1 border-round border-200">

                        <p:ajax event="rowSelect" listener="#{contentCategoryPage.onSelectData}"
                                update=":tools-frm" />
                        <p:ajax event="rowUnselect" listener="#{contentCategoryPage.onUnselectData}" 
                                update=":tools-frm" />

                        <p:column headerText="Internal Reference">
                            <h:outputText value="#{data.id}" />
                        </p:column>

                        <p:column headerText="Name">
                            <h:outputText value="#{data.name}" />
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

    <ui:define name="callout">

        <p:dialog id="create-data-dlg" widgetVar="createDataDlg" header="Tambah Kategori" dynamic="true" modal="true">
            <h:form id="create-data-frm">
                <div class="d-flex flex-column">
                    <div class="form-group">
                        <p:outputLabel for="internal-reference" value="Internal Reference" />
                        <p:inputText id="internal-reference" class="form-control" required="true"
                                     value="#{contentCategoryPage.transientData.id}" />
                    </div>

                    <div class="form-group">
                        <p:outputLabel for="name" value="Name" />
                        <p:inputText id="name" class="form-control" required="true"
                                     value="#{contentCategoryPage.transientData.name}" />
                    </div>

                    <div class="align-self-end">
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('createDataDlg').hide()" />
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Simpan" oncomplete="PF('createDataDlg').hide()"
                                         actionListener="#{contentCategoryPage.save}"
                                         update=":tools-frm :data-frm:data-tbl" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>

        <p:confirmDialog id="delete-data-confirm" header="Hapus Kategori"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteDataConfirm" >
            <h:form>
                <div class="d-flex flex-column">
                    <div class="d-flex flex-column mb-4">
                        <h:outputText class="d-block align-self-start" value="Apakah antum yakin ingin menghapus :" />
                        <h:outputText class="d-block align-self-start"  value="#{contentCategoryPage.selection.name} ?" />
                    </div>

                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         styleClass="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteDataConfirm').hide()" />
                        <p:commandButton value="Ya" immediate="true"
                                         actionListener="#{contentCategoryPage.onDeleteData}"
                                         onclick="PF('deleteDataConfirm').hide()"
                                         update=":tools-frm :data-frm:data-tbl" 
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>
    </ui:define>

</ui:decorate>
