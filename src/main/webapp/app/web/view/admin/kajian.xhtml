<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"  
                template="/WEB-INF/templates/admin/admin-lte.xhtml" 
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:pe="http://primefaces.org/ui/extensions" >

    <f:metadata>
        <ui:param name="brand" value="#{config.getString('application.websiteName')}" />
        <ui:param name="description" value="#{config.getString('application.firstSlogan')}" />
        <ui:param name="pageTitle" value="Kajian" />
        <ui:param name="leftSidebarContent" value="/WEB-INF/components/alhiqniy/main-menu.xhtml" />
        <f:viewParam name="m" value="#{adminPage.menu}" />
    </f:metadata>

    <ui:define name="stylesheet">
        <h:outputStylesheet library="css" name="video-js.css" />
        <h:outputStylesheet library="css" name="plyr.css" />
    </ui:define>

    <ui:define name="main-content">

        <div class="row">                        
            <div class="col-lg-6">
                <div class="row">
                    <div class="col-12">
                        <nav class="navbar navbar-white navbar-light border" > 
                            <div class="navbar-brand mb-0">Daftar Kajian</div>
                            <h:form id="kajian-tool-frm" class="ml-auto">
                                <p:commandButton icon="pi pi-plus" class="ui-button-primary ml-2"
                                                 immediate="true" actionListener="#{kajianAdminPage.onCreateKajian}" 
                                                 oncomplete="PF('createKajianDlg').show()" 
                                                 update=":create-kajian-dlg" />
                                <p:commandButton icon="pi pi-pencil" class="ui-button-secondary ml-2"
                                                 immediate="true" actionListener="#{kajianAdminPage.onEditKajian}" 
                                                 oncomplete="PF('createKajianDlg').show()" 
                                                 update=":create-kajian-dlg"                                        
                                                 disabled="#{kajianAdminPage.selectedKajian eq null}" />
                                <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                                 immediate="true" update=":delete-kajian-confirm" 
                                                 oncomplete="PF('deleteKajianConfirm').show()"                                         
                                                 disabled="#{kajianAdminPage.selectedKajian eq null}" />
                            </h:form>
                        </nav>

                        <h:form id="kajian-frm">
                            <p:dataTable var="kajian" value="#{kajianAdminPage.kajianList}" 
                                         paginator="true" rows="5" paginatorPosition="bottom" 
                                         paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                         selectionMode="single" selection="#{kajianAdminPage.selectedKajian}" paginatorAlwaysVisible="false"
                                         id="kajian-tbl" stripedRows="true" rowStyleClass="#{kajian.published ? 'text-success' : 'text-danger'}"
                                         class="border" >

                                <p:ajax event="rowSelect" listener="#{kajianAdminPage.onSelectKajian()}"
                                        update=":kajian-tool-frm :videokajian-frm:videokajian-tbl :videokajian-tool-frm :video-preview-frm :audio-preview-frm" />
                                <p:ajax event="rowUnselect" listener="#{kajianAdminPage.onUnselectKajian}" 
                                        update=":kajian-tool-frm :videokajian-tool-frm :video-preview-frm :audio-preview-frm" />
                                <p:ajax event="contextMenu" listener="#{kajianAdminPage.onSelectKajian()}"
                                        update=":kajian-tool-frm :videokajian-frm:videokajian-tbl :videokajian-tool-frm :video-preview-frm :audio-preview-frm" />

                                <p:column headerText="Judul" >
                                    <h:outputText value="#{kajian.title}" />
                                </p:column>

                                <p:column headerText="Ustadz">
                                    <h:outputText value="#{kajian.ustadz.fullname}" />
                                </p:column>

                                <p:column headerText="Kategori">
                                    <h:outputText value="#{kajian.contentCategory.name}" /> 
                                </p:column>

                                <p:column width="48">
                                    <p:commandButton icon="pi pi-info" update=":kajian-frm:metadata"
                                                     oncomplete="PF('metadata').show('#{component.clientId}')" > 
                                        <f:setPropertyActionListener value="#{kajian}"
                                                                     target="#{kajianAdminPage.selectedKajian}"/>
                                    </p:commandButton>
                                </p:column>

                            </p:dataTable>
                            <p:overlayPanel widgetVar="metadata" dismissable="true"
                                            showCloseIcon="true" dynamic="true"  >
                                <p:outputPanel id="metadata" class="text-nowrap">
                                    <p:column rendered="#{not empty kajianAdminPage.selectedKajian}">
                                        <h:outputText value="ID: #{kajianAdminPage.selectedKajian.id}" />
                                    </p:column>
                                </p:outputPanel>
                            </p:overlayPanel>
                        </h:form>
                    </div>
                </div>
            </div>
            <!-- /.col-md-6 -->
            <div class="col-lg-6">
                <div class="row">
                    <nav class="navbar navbar-expand navbar-white navbar-light border"> 
                        <div class="navbar-brand mb-0">Daftar Video</div>
                        <h:form id="videokajian-tool-frm" class="ml-auto" >
                            <p:selectBooleanButton offLabel="L"  onLabel="L"
                                                   immediate="true" title="Public Live"                                                  
                                                   disabled="#{kajianAdminPage.selectedKajian eq null}"
                                                   value="#{kajianAdminPage.selectedVideoKajian.publicLive}" >
                                <p:ajax event="change" listener="#{kajianAdminPage.onTogglePublicLive}" process="@this" update=":videokajian-frm:videokajian-tbl" />
                            </p:selectBooleanButton>
                            <p:selectBooleanButton offLabel="UL"  onLabel="UL"
                                                   immediate="true" title="Unlisted Live"                                                 
                                                   disabled="#{kajianAdminPage.selectedKajian eq null}"
                                                   value="#{kajianAdminPage.selectedVideoKajian.live}" >
                                <p:ajax event="change" listener="#{kajianAdminPage.onToggleLive}" update=":videokajian-frm:videokajian-tbl" />
                            </p:selectBooleanButton>
                            <p:commandButton icon="pi pi-plus" class="ui-button-primary ml-2"
                                             immediate="true"
                                             actionListener="#{kajianAdminPage.onCreateVideo}"
                                             
                                             
                                             disabled="#{kajianAdminPage.selectedKajian eq null}" />
                            <p:commandButton icon="pi pi-pencil" class="ui-button-secondary ml-2"
                                             immediate="true"
                                             actionListener="#{kajianAdminPage.onEditVideo}"
                                             oncomplete="PF('createVideoKajianDlg').show()" 
                                             update=":create-videokajian-dlg"
                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}" />
                            <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                             immediate="true"
                                             oncomplete="PF('deleteVideoKajianConfirm').show()"
                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}" />
                            <p:commandButton icon="pi pi-upload" class="ui-button-success ml-2" immediate="true"
                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}"
                                             oncomplete="PF('uploadDlg').show()" />
                            <p:commandButton icon="pi pi-external-link" class="ui-button-success ml-2" immediate="true"
                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}"
                                             onclick="PF('internalUploadDlg').show()" />
                            <p:commandButton icon="pi pi-youtube" class="ui-button-success ml-2" immediate="true"
                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}"
                                             onclick="PF('youtubeDownloadDlg').show()" />
                        </h:form>
                    </nav>
                    <div class="col-12 p-0">
                        <div>
                            <h:form id="videokajian-frm">
                                <p:dataTable var="video" value="#{kajianAdminPage.videoList}"
                                             paginator="true" rows="5" paginatorPosition="bottom"
                                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                             selectionMode="single" selection="#{kajianAdminPage.selectedVideoKajian}" paginatorAlwaysVisible="false"
                                             id="videokajian-tbl" stripedRows="true" rowStyleClass="#{video.published ? 'text-success' : 'text-danger'}"
                                             class="border">

                                    <p:ajax event="rowSelect" update=":videokajian-tool-frm :video-preview-frm :audio-preview-frm" />
                                    <p:ajax event="rowUnselect" listener="#{kajianAdminPage.onUnselectVideoKajian}" update=":videokajian-tool-frm :video-preview-frm :audio-preview-frm" />

                                    <p:column headerText="Waktu">
                                        <h:outputText value="#{video.eventTime}" >
                                            <f:convertDateTime type="localDateTime"  pattern="dd/MM/yyyy" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Keterangan">
                                        <h:outputText value="#{video.notes}" />
                                    </p:column>

                                    <p:column headerText="Actions" class="d-flex justify-content-evenly">
                                        <p:commandButton icon="pi pi-link" rendered="#{video.live}"
                                                         title="Unlisted Link" update=":videokajian-frm:linkCopy"
                                                         oncomplete="PF('metaLink').show('#{component.clientId}')" > 
                                            <f:setPropertyActionListener value="#{video}" target="#{kajianAdminPage.selectedVideoKajian}"/>
                                        </p:commandButton>
                                        <p:commandButton icon="pi pi-info" update=":videokajian-frm:meta-id" title="ID"
                                                         oncomplete="PF('metaId').show('#{component.clientId}')" > 
                                            <f:setPropertyActionListener value="#{video}"
                                                                         target="#{kajianAdminPage.selectedVideoKajian}"/>
                                        </p:commandButton>
                                    </p:column>

                                </p:dataTable>

                                <p:overlayPanel widgetVar="metaLink" dismissable="true"
                                                showCloseIcon="true" dynamic="true"  >
                                    <p:outputPanel id="meta-link" class="text-nowrap">
                                        <p:column rendered="#{not empty kajianAdminPage.selectedVideoKajian}">
                                            <p:inputText id="linkCopy" size="75" readonly="true" value="#{kajianAdminPage.unlistedLink}"/>
                                            <p:commandButton id="linkBtnCopy" icon="pi pi-copy" class="ml-2"/>
                                            <pe:clipboard trigger="linkBtnCopy" action="copy" target="linkCopy">
                                                <p:ajax event="success" listener="#{clipboardController.successListener}"/>
                                                <p:ajax event="error" listener="#{clipboardController.errorListener}"/>
                                            </pe:clipboard>
                                        </p:column>
                                    </p:outputPanel>
                                </p:overlayPanel>

                                <p:overlayPanel widgetVar="metaId" dismissable="true"
                                                showCloseIcon="true" dynamic="true"  >
                                    <p:outputPanel id="meta-id" class="text-nowrap">
                                        <p:column rendered="#{not empty kajianAdminPage.selectedVideoKajian}">
                                            <p:inputText id="idCopy" size="50" readonly="true" value="#{kajianAdminPage.selectedVideoKajian.id}"/>
                                            <p:commandButton id="idBtnCopy" icon="pi pi-copy" class="ml-2"/>
                                            <pe:clipboard trigger="idBtnCopy" action="copy" target="idCopy">
                                                <p:ajax event="success" listener="#{clipboardController.successListener}"/>
                                                <p:ajax event="error" listener="#{clipboardController.errorListener}"/>
                                            </pe:clipboard>
                                        </p:column>
                                    </p:outputPanel>
                                </p:overlayPanel>
                            </h:form>
                        </div>
                        <div class="mt-2">
                            <h:form id="video-preview-frm">
                                <div>
                                    <nav class="navbar navbar-expand navbar-white navbar-light border"> 
                                        <div class="navbar-brand mb-0">Video Preview</div>
                                        <div class="ml-auto" >
                                            <p:commandButton icon="fas fa-video" class="ui-button-success ml-2 fs-6" immediate="true"
                                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}"
                                                             actionListener="#{kajianAdminPage.handleExtractVideo}" 
                                                             onclick="PF('slicerDlg').show()" />
                                            <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                                             immediate="true"
                                                             oncomplete="PF('deleteVideoContentConfirm').show()"
                                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}" />
                                        </div>
                                    </nav>
                                </div>
                                <div>
                                    <ui:include src="/WEB-INF/components/player.xhtml">
                                        <ui:param name="video" value="#{kajianAdminPage.selectedVideoKajian}" />
                                        <ui:param name="id" value="preview" />
                                    </ui:include>
                                </div>
                            </h:form>
                        </div>
                        <div class="mt-2">
                            <h:form id="audio-preview-frm">
                                <div>
                                    <nav class="navbar navbar-expand navbar-white navbar-light border"> 
                                        <div class="navbar-brand mb-0">Audio Preview</div>
                                        <div class="ml-auto" >
                                            <p:commandButton icon="fas fa-volume-up" class="ui-button-success ml-2 fs-6" immediate="true"
                                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}"
                                                             actionListener="#{kajianAdminPage.handleExtractAudio}" 
                                                             onclick="PF('slicerDlg').show()" />
                                            <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                                             immediate="true"
                                                             oncomplete="PF('deleteAudioContentConfirm').show()"
                                                             disabled="#{kajianAdminPage.selectedVideoKajian eq null}" />
                                        </div>
                                    </nav>
                                </div>
                                <div>
                                    <ui:include src="/WEB-INF/components/audioplayer.xhtml">
                                        <ui:param name="video" value="#{kajianAdminPage.selectedVideoKajian}" />
                                        <ui:param name="id" value="audiopreview" />
                                    </ui:include>
                                </div>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /.col-md-6 -->
        </div>
    </ui:define>

    <ui:define name="callout">
        <p:dialog id="create-kajian-dlg" widgetVar="createKajianDlg"
                  header="Tambah Kajian" dynamic="true" modal="true">
            <h:form id="create-kajian-frm">
                <div class="d-flex">
                    <div class="d-flex flex-column">
                        <div class="form-group">
                            <p:outputLabel for="title" value="Judul" />
                            <p:inputText id="title" class="block w-100" required="true"
                                         value="#{kajianAdminPage.transientKajian.title}" />
                        </div>

                        <div class="form-group">
                            <p:outputLabel for="notes" value="Keterangan" />
                            <p:inputTextarea id="notes" class="w-100"
                                             value="#{kajianAdminPage.transientKajian.description}" />
                        </div>
                    </div>
                    <div class="d-flex flex-column px-4">

                        <div class="form-group">
                            <p:outputLabel for="ustadz" value="Ustadz" />
                            <p:selectOneMenu id="ustadz" class="w-100" required="true"
                                             value="#{kajianAdminPage.transientKajian.ustadz}"
                                             converter="UstadzConverter" hideNoSelectionOption="false" >
                                <f:selectItem noSelectionOption="true" itemLabel="Pilih Ustadz" itemValue="#{null}" />
                                <f:selectItems value="#{kajianAdminPage.asatidz}"
                                               var="ustadz" itemLabel="#{ustadz.fullname}"
                                               itemValue="#{ustadz}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="form-group">
                            <p:outputLabel for="category" value="Kategori" />
                            <p:selectOneMenu id="category" class="w-100" required="true"
                                             value="#{kajianAdminPage.transientKajian.contentCategory}"
                                             converter="ContentCategoryConverter" >
                                <f:selectItem noSelectionOption="true" itemLabel="Pilih Kategori" itemValue="#{null}" />
                                <f:selectItems value="#{kajianAdminPage.categories}"
                                               var="category" itemLabel="#{category.name}"
                                               itemValue="#{category}" />
                            </p:selectOneMenu>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <p:outputLabel for="tags" value="Tags" />
                            <p:selectCheckboxMenu id="tags" class="block inputfield w-100"
                                                  multiple="true" converter="TagConverter"
                                                  value="#{kajianAdminPage.transientKajian.tags}" >
                                <p:ajax event="itemUnselect" listener="#{kajianAdminPage.onTagUnselect}" />
                                <f:selectItems value="#{kajianAdminPage.tags}" />
                            </p:selectCheckboxMenu>
                        </div>

                        <div class="form-group align-self-end">
                            <p:toggleSwitch id="published" value="#{kajianAdminPage.transientKajian.published}">
                                <p:ajax listener="#{kajianAdminPage.togglePublished}" />
                            </p:toggleSwitch>
                            <p:outputLabel for="published" value="Published"  class="ml-2"/>
                        </div>
                    </div>
                </div>
                <div>                 
                    <div class="align-self-end">
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('createKajianDlg').hide()" />
                        <p:commandButton icon="fas fa-save" class="ui-confirmation-yes"
                                         value="Simpan" oncomplete="PF('createKajianDlg').hide()"
                                         actionListener="#{kajianAdminPage.saveKajian}"
                                         update=":kajian-tool-frm :kajian-frm:kajian-tbl :videokajian-tool-frm :videokajian-frm:videokajian-tbl" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>

        <p:confirmDialog id="delete-kajian-confirm" header="Hapus Kajian"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteKajianConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus kajian:" />
                        <h:outputText class="block align-self-start"  value="#{kajianAdminPage.selectedKajian.title} ?" />
                    </div>

                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         styleClass="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteKajianConfirm').hide()" />
                        <p:commandButton value="Ya" immediate="true"
                                         actionListener="#{kajianAdminPage.onDeleteKajian}"
                                         onclick="PF('deleteKajianConfirm').hide()"
                                         update=":kajian-tool-frm :kajian-frm:kajian-tbl :videokajian-tool-frm :videokajian-frm:videokajian-tbl" 
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:dialog id="create-videokajian-dlg" widgetVar="createVideoKajianDlg" 
                  header="Data Video" dynamic="true" modal="true" >
            <h:form id="create-videokajian-frm">
                <div>

                    <div class="d-flex flex-column mb-3">
                        <p:outputLabel for="event-time" value="Waktu" class="w-100" />
                        <p:datePicker id="event-time" pattern="dd/MM/yyyy HH:mm" timeInput="true" flex="true"
                                      showOnFocus="false" showIcon="true" yearNavigator="true"
                                      monthNavigator="true" yearRange="2005:2050" showTime="true" 
                                      value="#{kajianAdminPage.transientVideoKajian.eventTime}"  />
                    </div>

                    <div class="form-group">
                        <p:outputLabel for="notes" value="Keterangan" />
                        <p:inputTextarea id="notes" class="form-control"
                                         value="#{kajianAdminPage.transientVideoKajian.notes}" />
                    </div>

                    <div class="d-flex flex-column mb-3">
                        <p:outputLabel for="published" value="Published" />
                        <p:toggleSwitch id="published" 
                                        value="#{kajianAdminPage.transientVideoKajian.published}">
                            <p:ajax listener="#{kajianAdminPage.togglePublished}" />
                        </p:toggleSwitch>
                    </div>
                </div>
                <div>
                    <div class="d-flex justify-content-end">
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('createVideoKajianDlg').hide()" />
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Simpan" oncomplete="PF('createVideoKajianDlg').hide()"
                                         actionListener="#{kajianAdminPage.saveVideoKajian}"
                                         update=":videokajian-frm:videokajian-tbl" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>

        <p:confirmDialog id="delete-videokajian-confirm" header="Hapus Video"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteVideoKajianConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus video ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteVideoKajianConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{kajianAdminPage.onDeleteVideo}"
                                         onclick="PF('deleteVideoKajianConfirm').hide()"
                                         update=":videokajian-frm:videokajian-tbl :videokajian-tool-frm" 
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:dialog id="upload-dlg" widgetVar="uploadDlg" dynamic="true" modal="true" closable="true" header="Upload Video">
            <h:form enctype="multipart/form-data">
                <p:fileUpload mode="advanced" accept="/(\.|\/)(mp4)$/"
                              listener="#{kajianAdminPage.handleFileUpload}"
                              oncomplete="PF('uploadDlg').hide();PF('slicerDlg').show()" />
            </h:form>
        </p:dialog>

        <p:dialog id='slicer-dlg'  widgetVar="slicerDlg" dynamic="true" modal="true" closable="false" width="50%"
                  onShow="PF('poll').start()" onHide="postProcessing();PF('poll').stop()">
            <h:form>
                <p:remoteCommand name="postProcessing" update=":video-preview-frm :audio-preview-frm" />
                <h:outputText value="Sedang memproses video..." />
                <p:progressBar class="mt-2" style="height:6px" mode="indeterminate" />
                <p:poll interval="2" listener="#{kajianAdminPage.checkSliceComplete}"  autoStart="false" widgetVar="poll"  />
            </h:form>
        </p:dialog>

        <p:confirmDialog id="delete-videocontent-confirm" header="Hapus Video"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteVideoContentConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus video ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteAudioContentConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{kajianAdminPage.clearVideo}"
                                         onclick="PF('deleteVideoContentConfirm').hide();PF('slicerDlg').show()"
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:confirmDialog id="delete-audiocontent-confirm" header="Hapus Audio"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteAudioContentConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus audio ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteAudioContentConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{kajianAdminPage.clearAudio}"
                                         onclick="PF('deleteAudioContentConfirm').hide();PF('slicerDlg').show()"
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:dialog id="internal-upload-dlg" widgetVar="internalUploadDlg"
                  header="Internal Upload" dynamic="true" modal="true" positionType="absolute" >
            <h:form id="internal-upload-frm">
                <div>

                    <div class="form-group">
                        <p:outputLabel for="path" value="Path" />
                        <p:inputTextarea id="path" class="form-control"
                                         value="#{kajianAdminPage.internalPath}" />
                    </div>
                </div>
                <div>
