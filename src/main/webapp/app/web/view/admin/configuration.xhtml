<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/admin/admin-lte.xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <ui:param name="brand" value="#{config.getString('application.websiteName')}" />
        <ui:param name="description" value="#{config.getString('application.firstSlogan')}" />
        <ui:param name="pageTitle" value="Configuration" />
        <ui:param name="leftSidebarContent" value="/WEB-INF/components/alhiqniy/main-menu.xhtml" />
        <f:viewParam name="m" value="#{adminPage.menu}" />
    </f:metadata>

    <ui:define name="main-content">
        <div class="row">                        
            <div class="col-12">
                <nav class="navbar navbar-white navbar-light border" > 
                    <div class="navbar-brand mb-0">Parameter List</div>
                    <h:form id="tools-frm" class="ml-auto">
                        <p:commandButton icon="pi pi-pencil" class="ui-button-secondary ml-2"
                                         immediate="true" actionListener="#{configPage.onEditData}" 
                                         oncomplete="PF('createDataDlg').show()" 
                                         update=":create-data-dlg"                                        
                                         disabled="#{configPage.selection eq null}" />
                    </h:form>
                </nav>

                <h:form id="data-frm">
                    <p:dataTable id="data-tbl" var="data" value="#{configPage.model}" 
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 selectionMode="single" selection="#{configPage.selection}" paginatorAlwaysVisible="false"
                                 stripedRows="true" class="border-1 border-round border-200">

                        <p:ajax event="rowSelect" listener="#{configPage.onSelectData}"
                                update=":tools-frm" />
                        <p:ajax event="rowUnselect" listener="#{configPage.onUnselectData}" 
                                update=":tools-frm" />

                        <p:column headerText="Name">
                            <h:outputText value="#{data.remarks}" />
                        </p:column>

                        <p:column headerText="Nama">
                            <h:outputText value="#{data.value}" />
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
    <ui:define name="callout">

        <p:dialog id="create-data-dlg" widgetVar="createDataDlg" header="Ubah Parameter" dynamic="true" modal="true">
            <h:form id="create-data-frm">
                <div class="d-flex flex-column">
                    <div class="form-group">
                        <p:outputLabel for="cremarks" value="Parameter" />
                        <p:inputTextarea id="cremarks" class="form-control" readonly="true"
                                     value="#{configPage.transientData.remarks}" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="cvalue" value="Value" />
                        <p:inputText id="cvalue" class="form-control"
                                     value="#{configPage.transientData.value}" />
                    </div>

                    <div class="align-self-end">
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('createDataDlg').hide()" />
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Simpan" oncomplete="PF('createDataDlg').hide()"
                                         actionListener="#{configPage.save}"
                                         update=":tools-frm :data-frm:data-tbl" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>
    </ui:define>

</ui:composition>
