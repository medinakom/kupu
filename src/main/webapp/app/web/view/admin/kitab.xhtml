<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"  
                template="/WEB-INF/templates/admin/admin-lte.xhtml" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:pe="http://primefaces.org/ui/extensions">

    <f:metadata>
        <ui:param name="brand" value="#{config.getString('application.websiteName')}" />
        <ui:param name="description" value="#{config.getString('application.firstSlogan')}" />
        <ui:param name="pageTitle" value="Kitab" />
        <ui:param name="leftSidebarContent" value="/WEB-INF/components/alhiqniy/main-menu.xhtml" />
        <f:viewParam name="m" value="#{adminPage.menu}" />
    </f:metadata>

    <ui:define name="main-content">

        <div class="row">                        
            <div class="col-lg-6">
                <div class="row">
                    <div class="col-12">
                        <nav class="navbar navbar-white navbar-light border" > 
                            <div class="navbar-brand mb-0">Daftar Kajian</div>
                        </nav>

                        <h:form id="kajian-frm">
                            <p:dataTable var="kajian" value="#{kitabAdminPage.kajianList}" 
                                         paginator="true" rows="5" paginatorPosition="bottom" 
                                         paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                         selectionMode="single" selection="#{kitabAdminPage.selectedKajian}" paginatorAlwaysVisible="false"
                                         id="kajian-tbl" stripedRows="true" rowStyleClass="#{kajian.published ? 'text-success' : 'text-danger'}"
                                         class="border" >

                                <p:ajax event="rowSelect" listener="#{kitabAdminPage.onSelectKajian()}"
                                        update=":kitab-frm:kitab-tbl :kitab-tool-frm :kitab-preview-frm" />
                                <p:ajax event="rowUnselect" listener="#{kitabAdminPage.onUnselectKajian}" 
                                        update=":kitab-frm:kitab-tbl :kitab-tool-frm :kitab-preview-frm" />
                                <p:ajax event="contextMenu" listener="#{kitabAdminPage.onSelectKajian()}"
                                        update=":kitab-frm:kitab-tbl :kitab-tool-frm :kitab-preview-frm" />

                                <p:column headerText="Judul" >
                                    <h:outputText value="#{kajian.title}" />
                                </p:column>

                                <p:column headerText="Ustadz">
                                    <h:outputText value="#{kajian.ustadz.fullname}" />
                                </p:column>

                                <p:column headerText="Kategori">
                                    <h:outputText value="#{kajian.contentCategory.name}" /> 
                                </p:column>

                                <p:column width="48">
                                    <p:commandButton icon="pi pi-info" update=":kajian-frm:metadata"
                                                     oncomplete="PF('metadata').show('#{component.clientId}')" > 
                                        <f:setPropertyActionListener value="#{kajian}"
                                                                     target="#{kitabAdminPage.selectedKajian}"/>
                                    </p:commandButton>
                                </p:column>

                            </p:dataTable>
                            <p:overlayPanel widgetVar="metadata" dismissable="true"
                                            showCloseIcon="true" dynamic="true"  >
                                <p:outputPanel id="metadata" class="text-nowrap">
                                    <p:column rendered="#{not empty kitabAdminPage.selectedKajian}">
                                        <h:outputText value="ID: #{kitabAdminPage.selectedKajian.id}" />
                                    </p:column>
                                </p:outputPanel>
                            </p:overlayPanel>
                        </h:form>
                    </div>
                </div>
            </div>
            <!-- /.col-md-6 -->
            <div class="col-lg-6">
                <div class="row">
                    <nav class="navbar navbar-expand navbar-white navbar-light border"> 
                        <div class="navbar-brand mb-0">Daftar Kitab</div>
                        <h:form id="kitab-tool-frm" class="ml-auto" >
                            <p:commandButton icon="pi pi-plus" class="ui-button-primary ml-2"
                                             immediate="true"
                                             actionListener="#{kitabAdminPage.onCreateKitab}"
                                             oncomplete="PF('createKitabDlg').show()" 
                                             update=":create-kitab-dlg"
                                             disabled="#{kitabAdminPage.selectedKajian eq null}" />
                            <p:commandButton icon="pi pi-pencil" class="ui-button-secondary ml-2"
                                             immediate="true"
                                             actionListener="#{kitabAdminPage.onEditKitab}"
                                             oncomplete="PF('createKitabDlg').show()" 
                                             update=":create-kitab-dlg"
                                             disabled="#{kitabAdminPage.selectedKitab eq null}" />
                            <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                             immediate="true"
                                             oncomplete="PF('deleteKitabConfirm').show()"
                                             disabled="#{kitabAdminPage.selectedKitab eq null}" />
                            <p:commandButton icon="pi pi-upload" class="ui-button-success ml-2" immediate="true"
                                             disabled="#{kitabAdminPage.selectedKitab eq null}"
                                             oncomplete="PF('uploadDlg').show()" />
                        </h:form>
                    </nav>
                    <div class="col-12 p-0">
                        <div>
                            <h:form id="kitab-frm">
                                <p:dataTable var="kitab" value="#{kitabAdminPage.kitabList}" lazy="true"
                                             paginator="true" rows="5" paginatorPosition="bottom"
                                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                             selectionMode="single" selection="#{kitabAdminPage.selectedKitab}" paginatorAlwaysVisible="false"
                                             id="kitab-tbl" stripedRows="true" rowStyleClass="#{kitab.published ? 'text-success' : 'text-danger'}"
                                             class="border">

                                    <p:ajax event="rowSelect" update=":kitab-tool-frm :kitab-preview-frm" />
                                    <p:ajax event="rowUnselect" listener="#{kitabAdminPage.onUnselectKitab}" update=":kitab-tool-frm :kitab-preview-frm" />

                                    <p:column headerText="Judul">
                                        <h:outputText value="#{kitab.title}" />
                                    </p:column>

                                    <p:column headerText="Penulis">
                                        <h:outputText value="#{kitab.author}" />
                                    </p:column>

                                    <p:column width="48">
                                        <p:commandButton icon="pi pi-info" update=":kitab-frm:metadata-v"
                                                         oncomplete="PF('metadatav').show('#{component.clientId}')" > 
                                            <f:setPropertyActionListener value="#{kitab}"
                                                                         target="#{kitabAdminPage.selectedKitab}"/>
                                        </p:commandButton>
                                    </p:column>

                                </p:dataTable>
                                <p:overlayPanel widgetVar="metadatav" dismissable="true"
                                                showCloseIcon="true" dynamic="true"  >
                                    <p:outputPanel id="metadata-v" class="text-nowrap">
                                        <p:column rendered="#{not empty kitabAdminPage.selectedKitab}">
                                            <h:outputText value="ID: #{kitabAdminPage.selectedKitab.id}" />
                                        </p:column>
                                    </p:outputPanel>
                                </p:overlayPanel>
                            </h:form>
                        </div>
                        <div class="mt-2">
                            <h:form id="kitab-preview-frm">
                                <div>
                                    <nav class="navbar navbar-expand navbar-white navbar-light border"> 
                                        <div class="navbar-brand mb-0">Preview Kitab</div>
                                        <div class="ml-auto" >
                                            <p:commandButton icon="pi pi-trash" class="ui-button-danger ml-2"
                                                             immediate="true"
                                                             oncomplete="PF('deleteKitabContentConfirm').show()"
                                                             disabled="#{(kitabAdminPage.selectedKitab eq null) or (not kitabAdminPage.contentExists)}" />
                                        </div>
                                    </nav>
                                </div>
                                <div>
                                    <c:if test="#{(kitabAdminPage.selectedKitab ne null) and (kitabAdminPage.contentExists)}">
                                        <pe:documentViewer height="768" url="/api/videokajian/kitab/#{kitabAdminPage.selectedKitab.id}" zoom="page-width" />
                                    </c:if>
                                </div>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /.col-md-6 -->
        </div>
    </ui:define>

    <ui:define name="callout">

        <p:dialog id="create-kitab-dlg" widgetVar="createKitabDlg"
                  header="Data Kitab" dynamic="true" modal="true" positionType="absolute" >
            <h:form id="create-kitab-frm">
                <div>
                    <div class="form-group">
                        <p:outputLabel for="title" value="Judul" />
                        <p:inputTextarea id="title" class="form-control"
                                         value="#{kitabAdminPage.transientKitab.title}" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="author" value="Penulis" />
                        <p:inputTextarea id="author" class="form-control"
                                         value="#{kitabAdminPage.transientKitab.author}" />
                    </div>
                </div>
                <div>
                    <div class="d-flex justify-content-end">
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('createKitabDlg').hide()" />
                        <p:commandButton icon="pi pi-save" class="ui-confirmation-yes"
                                         value="Simpan" oncomplete="PF('createKitabDlg').hide()"
                                         actionListener="#{kitabAdminPage.saveKitab}"
                                         update=":kitab-frm:kitab-tbl" />
                    </div>
                </div>
            </h:form> 
        </p:dialog>

        <p:confirmDialog id="delete-kitab-confirm" header="Hapus Kitab"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteKitabConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus kitab ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteKitabConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{kitabAdminPage.onDeleteKitab}"
                                         onclick="PF('deleteKitabConfirm').hide()"
                                         update=":kitab-frm:kitab-tbl :kitab-tool-frm" 
                                         styleClass="ui-confirmation-yes" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

        <p:dialog id="upload-dlg" widgetVar="uploadDlg" dynamic="true" modal="true" closable="true" header="Upload Kitab">
            <h:form enctype="multipart/form-data">
                <p:fileUpload mode="advanced" accept="/(\.|\/)(pdf)$/"
                              listener="#{kitabAdminPage.handleKitabUpload}"
                              oncomplete="PF('uploadDlg').hide()"
                              update=":kitab-preview-frm" />
            </h:form>
        </p:dialog>


        <p:confirmDialog id="delete-kitabcontent-confirm" header="Hapus Konten"
                         closable="true" showEffect="fade"
                         responsive="true" widgetVar="deleteKitabContentConfirm" >
            <h:form>
                <div class="flex flex-column">
                    <div class="flex flex-column mb-4">
                        <h:outputText class="block align-self-start" value="Apakah antum yakin ingin menghapus konten ?" />
                    </div>
                    <div>
                        <p:commandButton value="Tidak" type="button" 
                                         class="ui-confirmation-no ui-button-flat"
                                         onclick="PF('deleteKitabContentConfirm').hide()" />
                        <p:commandButton value="Ya" immediate='true'
                                         actionListener="#{kitabAdminPage.clearContent}"
                                         oncomplete="PF('deleteKitabContentConfirm').hide()"
                                         styleClass="ui-confirmation-yes" update=":kitab-preview-frm" />
                    </div>
                </div>
            </h:form>
        </p:confirmDialog>

    </ui:define>


</ui:composition>
