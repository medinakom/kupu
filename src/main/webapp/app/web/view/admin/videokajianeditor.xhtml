<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Video Kajian" />
        <ui:param name="viewPage" value="#{videoKajianEditorPage}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="notool" value="true" />
        <ui:param name="nofilter" value="true"/>          

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="VideoKajianConverter" transient="true" />
        <f:viewParam name="kajian" value="#{viewPage.kajian}" converter="KajianConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="content-header" />

    <ui:define name="form">

        <div class="grid w-full p-3">
            <div class="col-12 md:col-6 md:col-offset-3">
                <ui:decorate template="/WEB-INF/components/core/base/formlet.xhtml">
                    <ui:define name="fields">

                        <div class="form-field">
                            <p:outputLabel for="kajian" value="Kajian" />
                            <p:inputText id="kajian" class="form-control" readonly="true"
                                         value="#{viewPage.entity.kajian.title}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="event-time" value="Waktu" class="w-100" />
                            <p:datePicker id="event-time" pattern="dd/MM/yyyy HH:mm" timeInput="true" flex="true"
                                          showOnFocus="false" showIcon="true" yearNavigator="true"
                                          monthNavigator="true" yearRange="2005:2050" showTime="true" 
                                          value="#{viewPage.entity.eventTime}"  />
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="notes" value="Keterangan" />
                            <p:inputTextarea id="notes" class="form-control"
                                             value="#{viewPage.entity.notes}" />
                        </div>

                        <div class="form-field">
                            <div class="flex align-items-center">
                                <p:toggleSwitch id="published" value="#{viewPage.entity.published}" immediate="true">
                                    <p:ajax process="@this" />
                                </p:toggleSwitch>
                                <p:outputLabel for="published" value="Published"  class="ml-2"/>
                            </div>
                        </div>
                    </ui:define>
                </ui:decorate>
            </div>
        </div>
    </ui:define>

</ui:composition>
