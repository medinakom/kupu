<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">


    <div class="block flex-grow-0 flex flex-nowrap align-items-center surface-300 border-0 border-bottom-1 border-300 gap-2">
        <h:form class="flex flex-nowrap align-items-center flex-grow-1 gap-2 mr-2">
            <ui:insert name="parent-nav">                
                <p:commandButton action="#{systemNavigator.open('Home', '')}" class="ui-button-flat"
                                 immediate="true" ajax="false" icon="pi pi-home" />
            </ui:insert>
            <ui:insert name="page-title">
                <h:outputText value="#{title}" class="ui-widget text-color font-medium text-2xl ml-2" />
            </ui:insert>
        </h:form>
        <h:form>
            <p:menuButton icon="pi pi-user" menuStyleClass="w-max" buttonStyleClass="ui-button-flat" >
                <p:menuitem value="#{request.userPrincipal.toString()}" styleClass="font-bold" />
                <p:separator />
                <ui:insert name="user-menu" />
                <p:menuitem value="Ubah Password"
                            action="#{securityNavigator.open('PasswordEditor', viewPage)}" 
                            rendered="#{viewPage.isUserHasRoles('can_login')}"
                            icon="pi pi-key" />
                <p:menuitem value="User"
                            action="#{securityNavigator.open('User', viewPage)}"
                            rendered="#{viewPage.isUserHasRoles('manage_security','manage_universe')}"
                            icon="pi pi-shield" />
                <p:menuitem value="Group"
                            action="#{securityNavigator.open('ApplicationSecurityGroup', viewPage)}"
                            rendered="#{rolesChecker.isUserHasRoles('manage_security','manage_universe')}"
                            icon="pi pi-users" />
                <p:menuitem value="Pengaturan"
                            actionListener="#{viewPage.gotoConfigs}"
                            rendered="#{viewPage.isUserHasRoles('manage_configs','manage_universe')}"
                            icon="pi pi-cog" />
                <p:separator />
                <ui:insert name="logout-menu">
                    <p:menuitem value="Keluar" action="#{loginPage.logout}" 
                                ajax="false" icon="pi pi-sign-out"
                                rendered="#{viewPage.isUserHasRoles('can_login')}" />
                </ui:insert>
            </p:menuButton>
        </h:form>
        <h:form>
            <p:menuButton icon="pi pi-bars" menuStyleClass="w-max" buttonStyleClass="ui-button-flat"  >                
                <ui:insert name="module-menu"/>
                    <p:separator />
                    <p:menuitem icon="pi pi-info" value="Petunjuk" />
            </p:menuButton>
        </h:form>
    </div>

</ui:composition>
