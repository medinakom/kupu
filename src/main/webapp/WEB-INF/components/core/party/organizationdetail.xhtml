<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html" >


    <div class="grid w-full p-4">
        <div class="col-12 md:col-6">
            <h:form>
                <ui:decorate template="/WEB-INF/components/core/party/organizationform.xhtml" >
                    <ui:param name="form" value="#{editor.form}" />
                    <ui:param name="required" value="#{editor.form.required}" />

                    <ui:define name="actions">
                        <p:commandButton icon="pi pi-check" action="#{editor.updateParty}" class="ui-button-flat" />
                    </ui:define>
                </ui:decorate>
            </h:form>
        </div>

        <ui:insert name="postaladdress-list">
            <div class="col-12 md:col-6">
                <h:form>
                    <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                        <ui:param name="title" value="Daftar Alamat" />
                        <ui:param name="dataView" value="#{editor.postalAddressList}" />
                        <ui:param name="contentId" value="#{dataView.name}" />

                        <ui:define name="actions">
                            <p:commandButton icon="pi pi-tag" immediate="true"
                                             actionListener="#{dataView.makeSelectionAsDefault}" 
                                             disabled="#{dataView.selections.isEmpty()}" 
                                             update="#{contentId}" class="ui-button-flat" />
                            <ui:include src="/WEB-INF/components/core/base/crud-create.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-update.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-delete.xhtml"/>
                        </ui:define>

                        <ui:define name="fields">
                            <ui:include src="/WEB-INF/components/core/party/postaladdresslist.xhtml">
                                <ui:param name="selectListener" value="@form:actions" />
                                <ui:param name="scrollHeight" value="250" />
                            </ui:include>
                        </ui:define>

                        <ui:define name="footer">
                            <ui:include src="/WEB-INF/components/core/base/pager-alt.xhtml" >
                                <ui:param name="pager" value="#{dataView.pager}" />
                            </ui:include>
                        </ui:define>
                    </ui:decorate>
                </h:form>
            </div>
        </ui:insert>

        <ui:insert name="telecommunicationnumber-list">
            <div class="col-12 md:col-6">
                <h:form>
                    <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                        <ui:param name="title" value="Daftar Nomor Telepon" />
                        <ui:param name="dataView" value="#{editor.telecommunicationNumberList}" />
                        <ui:param name="contentId" value="#{dataView.name}" />

                        <ui:define name="actions">
                            <p:commandButton icon="pi pi-tag" immediate="true"
                                             actionListener="#{dataView.makeSelectionAsDefault}" 
                                             disabled="#{dataView.selections.isEmpty()}" 
                                             update="#{contentId}" class="ui-button-flat" />
                            <ui:include src="/WEB-INF/components/core/base/crud-create.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-update.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-delete.xhtml"/>
                        </ui:define>

                        <ui:define name="fields">
                            <ui:include src="/WEB-INF/components/core/party/telecommunicationnumberlist.xhtml">
                                <ui:param name="selectListener" value="@form:telecommunication-actions" />
                                <ui:param name="scrollHeight" value="250" />
                            </ui:include>
                        </ui:define>

                        <ui:define name="footer">
                            <ui:include src="/WEB-INF/components/core/base/pager-alt.xhtml" >
                                <ui:param name="pager" value="#{dataView.pager}" />
                            </ui:include>
                        </ui:define>
                    </ui:decorate>
                </h:form>
            </div>
        </ui:insert>

        <ui:insert name="electronicaddress-list">
            <div class="col-12 md:col-6">
                <h:form>
                    <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                        <ui:param name="title" value="Daftar Alamat Elektronik" />
                        <ui:param name="dataView" value="#{editor.electronicAddressList}" />
                        <ui:param name="contentId" value="#{dataView.name}" />

                        <ui:define name="actions">
                            <p:commandButton icon="pi pi-tag" immediate="true"
                                             actionListener="#{dataView.makeSelectionAsDefault}" 
                                             disabled="#{dataView.selections.isEmpty()}" 
                                             update="#{contentId}"
                                             class="ui-button-flat" />
                            <ui:include src="/WEB-INF/components/core/base/crud-create.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-update.xhtml"/>
                            <ui:include src="/WEB-INF/components/core/base/crud-delete.xhtml"/>
                        </ui:define>

                        <ui:define name="fields">
                            <ui:include src="/WEB-INF/components/core/party/electronicaddresslist.xhtml">
                                <ui:param name="selectListener" value="@form:actions" />
                                <ui:param name="scrollHeight" value="250" />
                            </ui:include>
                        </ui:define>

                        <ui:define name="footer">
                            <ui:include src="/WEB-INF/components/core/base/pager-alt.xhtml" >
                                <ui:param name="pager" value="#{dataView.pager}" />
                            </ui:include>
                        </ui:define>
                    </ui:decorate>
                </h:form>
            </div>
        </ui:insert>

        <ui:insert name="logo">
            <div class="col-12 md:col-6"> 
                <h:form id="logo-frm" enctype="multipart/form-data">
                    <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                        <ui:param name="title" value="Logo" />
                        <ui:param name="updateListener" value="@form" />

                        <ui:define name="actions">
                            <p:fileUpload id="upload" skinSimple="true" auto="true" mode="simple" 
                                          styleClass="ui-button-flat" chooseIcon="pi pi-upload"
                                          process="@this" update="@form:logo"
                                          listener="#{editor.handleLogoUpload}" />
                        </ui:define>

                        <ui:define name="fields">
                            <p:graphicImage id="logo" url="#{request.contextPath}/ws/party/picture/#{editor.party.id}"
                                            class="w-full" cache="false" />
                        </ui:define>

                    </ui:decorate>
                </h:form>
            </div>
        </ui:insert>

        <ui:remove>
            <ui:insert name="classification-list">
                <div class="col-12 md:col-6">
                    <h:form>
                        <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                            <ui:param name="title" value="Daftar Kategori" />
                            <ui:param name="dataView" value="#{editor.classificationList}" />
                            <ui:param name="contentId" value="#{dataView.name}" />

                            <ui:define name="actions">
                                <ui:include src="/WEB-INF/components/core/base/crud-create.xhtml" />
                                <ui:include src="/WEB-INF/components/core/base/crud-delete.xhtml"/>
                            </ui:define>

                            <ui:define name="fields">
                                <ui:include src="/WEB-INF/components/core/party/partyclassificationlist.xhtml">                            
                                    <ui:param name="selectListener" value="@form:actions" />
                                    <ui:param name="scrollHeight" value="250" />
                                </ui:include>
                            </ui:define>

                            <ui:define name="footer">
                                <ui:include src="/WEB-INF/components/core/base/pager-alt.xhtml" >
                                    <ui:param name="pager" value="#{dataView.pager}" />
                                </ui:include>
                            </ui:define>
                        </ui:decorate>
                    </h:form>
                </div>
            </ui:insert>
        </ui:remove>

        <ui:insert name="role-list">
            <div class="col-12 md:col-6">
                <h:form>
                    <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                        <ui:param name="title" value="Daftar Role" />
                        <ui:param name="dataView" value="#{editor.roleList}" />
                        <ui:param name="contentId" value="#{dataView.name}" />

                        <ui:define name="fields">
                            <ui:include src="/WEB-INF/components/core/party/partyrolelist.xhtml"> 
                                <ui:param name="scrollHeight" value="250" />
                            </ui:include>
                        </ui:define>

                        <ui:define name="footer">
                            <ui:include src="/WEB-INF/components/core/base/pager-alt.xhtml" >
                                <ui:param name="pager" value="#{dataView.pager}" />
                            </ui:include>
                        </ui:define>
                    </ui:decorate>
                </h:form>
            </div>
        </ui:insert>

        <ui:insert name="role-form" />

    </div>
</ui:composition>
