<ui:composition xmlns:ui="jakarta.faces.facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <div class="filter-field">
        <p:outputLabel for="module" value="Module" />
        <p:selectOneMenu id="module" value="#{filter.content.module}" >
            <f:selectItems value="#{theApp.moduleInfos}"
                           var="m" itemLabel="#{string[m.label]}" itemValue="#{m.name}" />
        </p:selectOneMenu>
    </div>

</ui:composition>
