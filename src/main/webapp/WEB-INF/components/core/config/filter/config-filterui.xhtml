<ui:composition xmlns:ui="jakarta.faces.facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <div class="filter-field">
        <p:outputLabel for="module" value="Module" />
        <p:selectOneMenu id="module" value="#{dataView.filter.content.module}" >                    
            <f:selectItem itemLabel="Semua" itemValue="#{null}" />
            <f:selectItems value="#{theApp.moduleInfos}" var="m" itemLabel="#{string[m.label]}" itemValue="#{m}" />
        </p:selectOneMenu>
    </div>

</ui:composition>
