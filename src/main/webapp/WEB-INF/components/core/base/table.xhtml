<ui:composition xmlns:ui="jakarta.faces.facelets" 
                xmlns:p="primefaces"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">

    <p:dataTable id="#{tableId ne null ? tableId : dataView.name}" widgetVar="#{dataView.name}"
                 value="#{dataView.fetchedItems}" var="data" transient="true"
                 rowKey="#{data.id}" rowIndexVar="idx"
                 selectionMode="#{dataView.selectionMode}"                 
                 selection="#{dataView.selectionMode eq 'single' ? dataView.selection : dataView.selections}"
                 editable="#{editable ne null ? editable : false}" editMode="cell" editInitEvent="dblclick" 
                 scrollable="true" scrollHeight="#{scrollHeight ne null ? scrollHeight : 0}" rowStyleClass="#{rowStyle}"
                 resizableColumns="true" stripedRows="true" showGridlines="true"
                 emptyMessage="#{string['common.hint.emptyData']}" styleClass="#{tableStyle}" >

        <p:ajax event="rowSelect" immediate="true"
                oncomplete="#{selectCallback};updateAddress();refreshCasing();"
                update="#{selectListener}" />
        <p:ajax event="rowUnselect" immediate="true"
                oncomplete="#{selectCallback};updateAddress();refreshCasing();"
                update="#{selectListener}" />
        <p:ajax event="contextMenu" immediate="true"
                oncomplete="#{selectCallback};updateAddress();refreshCasing();" 
                update="@form:context-menu #{selectListener}" />
        <p:ajax event="cellEdit" immediate="true"
                listener="#{dataView.onCellEdit}" />

        <ui:insert name="prefix-columns" />
        <ui:insert name="columns" />
        <ui:insert name="suffix-columns" />

    </p:dataTable>

    <p:contextMenu id="context-menu" for="#{tableId ne null ? tableId : dataView.name}">
        <ui:insert name="crud-context-menu">
            <ui:insert name="crud-create">
                <ui:include src="/WEB-INF/components/core/base/menu-create.xhtml" />
            </ui:insert>
            <ui:insert name="crud-update">
                <ui:include src="/WEB-INF/components/core/base/menu-update.xhtml" />
            </ui:insert>
            <ui:insert name="crud-delete">
                <ui:include src="/WEB-INF/components/core/base/menu-delete.xhtml" />
            </ui:insert>
        </ui:insert>
        <ui:insert name="context-menu" />
    </p:contextMenu>

    <p:dialog header="Konfirmasi" widgetVar="#{dataView.name}deleteDlg" appendTo="@(body)"
              modal="true" closable="true" dynamic="true"  >
        <p>Data akan dihapus !</p>
        <f:facet name="footer">
                <p:commandButton type="button" value="Batal" 
                                 onclick="PF('#{dataView.name}deleteDlg').hide()" />
                <p:commandButton type="button" value="Lanjut" 
                                 onclick="#{dataView.name}deleteCmd()" />
        </f:facet>
    </p:dialog>

    <p:remoteCommand name="#{dataView.name}deleteCmd" actionListener="#{dataView.onDelete}" 
                     oncomplete="PF('#{dataView.name}deleteDlg').hide();updateAddress();refreshCasing();refreshContent();#{updateCallback}"
                     update="#{updateListener} :messages" />

    <h:outputScript>
        $(document).ready(function() {

        var elements = document.getElementById(PF('#{dataView.name}').id)
        .getElementsByTagName('tbody')[0]
        .getElementsByClassName('ui-state-highlight');
        if(elements.length > 0) {
        elements[0].scrollIntoViewIfNeeded();
        }

        });
    </h:outputScript>


</ui:composition>
