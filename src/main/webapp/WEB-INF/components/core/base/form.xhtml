<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html">

    <p:card class="border-1 border-bluegray-300" rendered="#{rendered ne null ? rendered : true}">

        <f:facet name="title">
            <h:outputText value="#{title}" />
        </f:facet>        

        <h:panelGroup id="actions" layout="block" class="flex justify-content-end gap-2 surface-200 border-top-1 border-left-1 border-right-1 border-bottom-0 border-bluegray-200">
            <ui:insert name="actions" />
        </h:panelGroup>

        <div class="border-1 border-bluegray-200">
                <ui:insert name="fields" />
        </div>

        <f:facet name="footer">
            <div class="flex justify-content-end gap-2">
                <ui:insert name="footer" />
            </div>
        </f:facet>

    </p:card>

</ui:composition>
