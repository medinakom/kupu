<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets" 
    xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="jakarta.faces.core"
    xmlns:c="jakarta.tags.core">

    <style>
        .filter-container {
            display: flex!important;
            align-items: center!important;
        }
        .filter-content {
            display: block;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
            font-size: .8rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border: thin solid #607d8b;
            border-radius: 1.25rem;
            background-color: #607d8b;
            padding: .5rem;
        }
    </style>

    <ui:param name="filter" value="#{filter}" />

    <p:commandButton id="#{filter ne null ? filter.name : 'filter'}" 
                     immediate="true" rendered="#{filter ne null}"
                     icon="pi pi-filter"
                     update="@form"
                     oncomplete="PF('#{filter.name}').show()" 
                     styleClass="#{filter.filtering ? 'ui-button-warning' : 'ui-button-flat'}" />

    <p:sidebar rendered="#{filter ne null}" fullScreen="true"
               widgetVar="#{filter.name}" dynamic="true"   >

        <div class="mt-4 flex flex-column pb-6 h-screen">
            <div class="flex-grow-0 flex flex-column mb-2">
                <h:outputText value="Filter" class="text-xl font-bold" />
            </div>

            <div class="flex-grow-1 flex flex-column p-4 gap-4 overflow-y-auto border-1 border-round surface-border">
                <ui:include src="#{filterUi}" />
            </div>

            <div class="flex-grow-0 flex justify-content-center p-2 w-full surface-300 border-1 border-round-bottom surface-border">
                <p:commandButton value="Terapkan"
                                 actionListener="#{filter.doFilter}"
                                 oncomplete="#{filterCallback}; PF('#{filter.name}').hide();"
                                 update="@form #{filterListener}" 
                                 icon="pi pi-filter"                                 
                                 class="ui-button-warning mr-2" />
                <p:commandButton value="Kosongkan" immediate="true"
                                 actionListener="#{filter.clear}"
                                 update="@form #{filterListener}" 
                                 oncomplete="PF('#{filter.name}').show();"
                                 icon="pi pi-filter" 
                                 class="ui-button-secondary" />
            </div>
        </div>
    </p:sidebar>

</ui:composition>
