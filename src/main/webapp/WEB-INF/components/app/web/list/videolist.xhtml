<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces">

    <ui:decorate template="/WEB-INF/components/core/base/table.xhtml" >
        <ui:param name="dataView" value="#{dataView}" />
        <ui:param name="selectListener" value="#{selectListener}" />

        <ui:define name="columns">
            
            <p:column headerText="Judul">
                <h:outputText value="#{data.notes}" />
            </p:column>
            
            <p:column headerText="Link" class="text-center">
                <p:commandLink >
                    <i class="pi pi-arrow-right" />
                </p:commandLink>
            </p:column>
        </ui:define>

    </ui:decorate>
</ui:composition>
