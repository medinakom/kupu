<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <div class="card mb-4" style="background-color: var(--md-ref-palette-tertiary80)">
        <div class="card-header bg-transparent border-bottom-0 text-center" >
            <span class="fw-bold fs-4" style="color:var(--md-ref-palette-primary50)">Kitab Kajian</span>
        </div>
        <div class="card-body p-2">
            <h:form>
                <ul class="list-group">
                    <ui:repeat value="#{kajianRetriever.kajianWithKitab}" var="kajian">
                        <li class="list-group-item list-group-item-action border-0 mb-2" >
                            <ui:include src="/WEB-INF/components/app/web/view/card-kajian-with-kitab-v.xhtml">
                                <ui:param name="kajian" value="#{kajian}" />
                            </ui:include>
                        </li>
                    </ui:repeat>
                </ul>
            </h:form>
        </div>
    </div>

</ui:composition>
