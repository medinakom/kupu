<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <div class="card mb-4" style="background-color: var(--md-ref-palette-secondary90)">
        <div class="card-header bg-transparent text-center border-0">
            <span class="fw-bold primary-text fs-4">Kajian Asatidz</span>
        </div>
        <div class="card-body p-2 border-0">
            <h:form>
                <ul class="list-group">
                    <ui:repeat value="#{kajianRetriever.asatidz}" var="ustadz">
                        <li class="list-group-item list-group-item-action border-0 mb-2" >
                            <ui:include src="/WEB-INF/components/app/web/view/card-ustadz-v.xhtml">
                                <ui:param name="ustadz" value="#{ustadz}" />
                            </ui:include>
                        </li>
                    </ui:repeat>
                </ul>
            </h:form>
        </div>
    </div>

</ui:composition>
