<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" 
                xmlns:p="http://primefaces.org/ui">

    <!--nav class="navbar navbar-expand-lg sticky-top navbar-dark bg-dark py-0 " style="background-color:#1e1b16!important; color: #ffffff"-->
    <style>
        .nav-link {
            color: var(--md-sys-color-on-primary-container)!important;
            font-family: var(--md-sys-typescale-display-medium-font-family-name);
        }
        .nav-link:hover, .nav-link.active {
            border-bottom: 4px solid var(--md-sys-color-primary)
        }
    </style>
    <nav class="navbar navbar-expand-lg sticky-top pt-0 pb-0 flex-column" >

        <div class="container-fluid justify-content-lg-center justify-content-sm-start primary" >

            <ui:insert name="hamburger">
                <div class="d-flex align-items-center" >
                    <a class="navbar-toggler on-primary-text" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
                       aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation" >
                        <i class="pi pi-bars" />
                    </a>
                </div>
            </ui:insert>

            <a class="navbar-brand d-flex flex-grow-1 flex-column align-items-center" href="/app/web/index.xhtml">
                <h:outputText class="fw-bold display-5 mb-0 on-primary-text" value="#{brand}" />
                <h:outputText class="fs-6 on-primary-text"
                              value="#{config.getString('web.firstSlogan')} #{config.getString('web.secondSlogan')}" />
            </a>
        </div>

        <ui:insert name="menu">
            <div class="collapse navbar-collapse justify-content-sm-center border-0 w-100 primary-container"                 
                 id="navbarSupportedContent">
                <ul class="navbar-nav fs-6 text-lg-center px-2 on-surface-text">
                    <li class="nav-item">
                        <p:link value="Serambi" 
                                outcome="/app/web/index.xhtml"
                                class="nav-link text-decoration-none #{((page.activeCategoryId eq null) and (page.activeUstadzId eq null) and (page.activeKajianId eq null)) or (page.activeCategoryId eq 'home') ? 'active' : ''}" />
                    </li>
                    <li class="nav-item">
                        <p:link value="Kajian Asatidz"
                                outcome="/app/web/view/asatidz.xhtml?u=-1"
                                class="nav-link text-decoration-none #{page.activeUstadzId ne null ? 'active' : ''}"  />
                    </li>
                    <li class="nav-item">
                        <p:link value="Kitab Kajian"
                                outcome="/app/web/view/kitab.xhtml?k=null" 
                                class="nav-link text-decoration-none #{page.activeKajianId ne null ? 'active' : ''}" />
                    </li>
                    <li class="nav-item">
                        <p:link value="Kajian Live"
                                outcome="/app/web/index.xhtml?c=live"
                                class="nav-link text-decoration-none #{page.activeCategoryId eq 'live' ? 'active' : ''}"  />
                    </li>
                    <li class="nav-item">
                        <p:link value="Kajian Radio"
                                outcome="/app/web/index.xhtml?c=radio"
                                class="nav-link text-decoration-none #{page.activeCategoryId eq 'radio' ? 'active' : ''}"  />
                    </li>
                </ul>
            </div>
        </ui:insert>
    </nav>

</ui:composition>
