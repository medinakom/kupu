<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" 
                xmlns:p="http://primefaces.org/ui">

    <div class="card bg-transparent border-0">
        <div class="row g-0">
            <div class="col-12 d-flex">
                <div class="card-body flex-fill d-flex align-items-start overflow-hidden p-2">
                    <div class="me-2">
                        <i class="pi pi-ellipsis-v" />
                    </div>
                    <div class="flex-column">
                        <h:link class="d-block fw-bold stretched-link text-decoration-none primary-text"
                                value="#{kajian.title}" title="#{kajian.title}"                          
                                outcome="/app/web/view/video.xhtml?k=#{kajian.id}&amp;v=#{video.id}" />
                        <h:outputText class="d-block primary-text" value="#{kajianRetriever.getVideoCountByKajian(kajian)} Video" />
                    </div>
                </div>
            </div>
        </div>
    </div>

</ui:composition>
