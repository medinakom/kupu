<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <div class="card bg-transparent border-0">
        <div class="row g-0">
            <div class="col-12 d-flex">
                <div class="card-body flex-fill d-flex align-items-start overflow-hidden p-2">
                    <div class="me-2">
                        <i class="pi pi-ellipsis-v" />
                    </div>
                    <div class="flex-column">
                        <h:link class="d-block fw-bold stretched-link text-reset text-decoration-none"
                                value="#{kitab.title}" title="#{kitab.title}"                          
                                outcome="/kitab.xhtml?k=#{kitab.id}&amp;c=#{kitab.content.id}" />
                        <span class="d-block d-flex">
                            <h:outputText class="text-truncate" value="Ustadz #{kitab.author}" />
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</ui:composition>
