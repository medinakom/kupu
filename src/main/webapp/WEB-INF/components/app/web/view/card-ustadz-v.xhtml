<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <div class="card border-0">
        <div class="row g-0">
            <div class="col-12 d-flex">
                <div class="card-body flex-fill d-flex align-items-start overflow-hidden p-2">
                    <div class="me-2">
                        <i class="pi pi-ellipsis-v" />
                    </div>
                    <div class="flex-column">
                        <h:link value="Ustadz #{ustadz.fullname}"                         
                                outcome="/app/web/view/asatidz.xhtml?u=#{ustadz.id}"
                                class="d-block fw-bold stretched-link text-decoration-none primary-text"/>
                        <h:outputText value="#{kajianRetriever.getKajianCountByUstadz(ustadz.id)} Kajian"
                                      class="d-block primary-text" />
                    </div>
                </div>
            </div>
        </div>
    </div>

</ui:composition>
