<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" 
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <div class="card border-0 bg-transparent text-white">
        <div class="row g-0">
            <div class="col-12 d-flex">
                <div class="card-body flex-fill d-flex flex-column py-0">
                    <h:link class="flex-fill fw-bold stretched-link text-decoration-none text-reset" style="font-size: medium"
                            value="#{kajian.title}" 
                            outcome="/video.xhtml?k=#{kajian.id}&amp;v=#{video.id}" />
                    <h:outputText class="d-inline-block" style="font-size: small"  value="#{kajian.ustadz.fullname}" />
                </div>
            </div>
        </div>
    </div>

</ui:composition>
