<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <div class="d-flex flex-column px-0 pt-2 pb-2">
        <h:form class="d-block border-1 d-flex flex-grow-1 p-2" style="background-color: var(--md-ref-palette-primary98); border: thin solid var(--md-ref-palette-primary90);">
            <div class="ui-inputgroup flex-grow-1">
                <p:inputText value="#{page.searchTerm}" placeholder="Judul Kajian" class="flex-grow-1" />
                <p:commandButton value="Cari" actionListener="#{page.gotoSearchResult}"/>
            </div>
        </h:form>
    </div>

</ui:composition>
