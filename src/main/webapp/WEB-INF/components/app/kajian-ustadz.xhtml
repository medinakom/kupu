<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <ui:repeat value="#{kajianRetriever.asatidz}" var="ustadz">
        <div class="card mb-4" style="">
            <div class="card-header border-bottom-0 text-center" 
                 style=" border-top: 3px solid #3c7101!important; background-color: #fbf8ef; color: #3c7101; font-family: Noto Sans, sans-serif!important; font-weight: 600!important; font-size: 1.25rem!important;">
                <span class="fw-bold text-truncate">Kajian Ustadz #{ustadz.name}</span>
            </div>
            <div class="card-body p-2" style="background-color: #fbf8ef;">
                <ul class="list-group">  
                    <ui:repeat value="#{kajianRetriever.getByUstadz(ustadz.id)}" var="kajian">
                        <li class="list-group-item list-group-item-action border-0 mb-2" style="background-color: #ffffff!important; border-bottom: thin solid #c9c7bf!important"> 
                            <ui:include src="/WEB-INF/components/card-kajian-ustadz-v.xhtml">
                                <ui:param name="kajian" value="#{kajian}" />
                                <ui:param name="video" value="#{kajianRetriever.getFirstVideo(kajian)}" />
                            </ui:include>
                        </li>
                    </ui:repeat>
                </ul>
            </div>
        </div>
    </ui:repeat>

</ui:composition>
