<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" 
                xmlns:h="http://xmlns.jcp.org/jsf/html" >

    <div class="card mb-4" style="">
        <div class="card-header border-bottom-0 text-center" 
             style=" border-top: 3px solid #3c7101!important; background-color: #fbf8ef; color: #3c7101; font-family: Noto Sans, sans-serif!important; font-weight: 600!important; font-size: 1.25rem!important;">
            <span class="fw-bold">Video Terbaru</span>
        </div>
        <div class="card-body p-2" style="background-color: #fbf8ef;">
            <h:form>
                <ul class="list-group">   
                    <ui:repeat value="#{kajianRetriever.newestVideos}" var="video" >
                        <li class="list-group-item list-group-item-action border-0 mb-2"  style="background-color: #ffffff!important; border-bottom: thin solid #c9c7bf!important">
                            <ui:include src="/WEB-INF/components/card-video-v.xhtml">
                                <ui:param name="kajian" value="#{videoPage.kajian}" />
                                <ui:param name="video" value="#{video}" />
                            </ui:include>
                        </li>
                    </ui:repeat>
                </ul>
            </h:form>
        </div>
    </div>
</ui:composition>
