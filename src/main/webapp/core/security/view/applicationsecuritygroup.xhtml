<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/templates/child-page.xhtml"
                xmlns:p="primefaces">

    <f:metadata>

        <ui:param name="primaryTitle" value="Group" />

        <ui:param name="viewPage" value="#{applicationSecurityGroupPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="dataView" value="#{viewPage.dataView}" />
        <ui:param name="contentId" value=":data-frm:#{dataView.name}" />         
        <ui:param name="notool" value="true" />

        <ui:param name="filter" value="#{dataView.filter}" />
        <ui:param name="filterType" value="overlay" />
        <ui:param name="filterUi" value="/WEB-INF/components/core/security/applicationsecuritygroup-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/core/security/meta/applicationsecuritygroup-filterui.xhtml" /> 

        <ui:param name="pager" value="#{dataView.pager}" />
        <ui:include src="/WEB-INF/components/core/base/meta/pager.xhtml" />

        <f:viewParam name="s" value="#{dataView.selectionsInternal}" 
                     converter="ApplicationSecurityGroupListConverter" transient="true" />

    </f:metadata>

    <ui:define name="content">
        <h:form id="data-frm">
            <ui:decorate template="/WEB-INF/components/core/security/applicationsecuritygrouplist.xhtml" >
                <ui:param name="selectListener" value=":tools-frm" />
                <ui:param name="editable" value="true" />

                <ui:define name="suffix-columns">
                    <p:column headerText="Landing Page" exportTag="landingPage">  
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{data.landingPage}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{data.landingPage}" 
                                         immediate="true"
                                         class="w-full h-full" />
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                </ui:define>
            </ui:decorate>
        </h:form>
    </ui:define>

</ui:composition>
