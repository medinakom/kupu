<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">

    <f:metadata> 

        <ui:param name="title" value="Entitas Bisnis" />

        <ui:param name="viewPage" value="#{entitasPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>
        
        <ui:param name="dataView" value="#{viewPage.dataView}" />
        <ui:param name="contentId" value=":data-frm:#{dataView.name}" />
        <ui:param name="notool" value="true" /> 

        <f:viewParam name="s" value="#{dataView.selectionInternal}" converter="BusinessEntityConverter" transient="true" /> 

    </f:metadata>

    <ui:define name="content">
        <h:form id="data-frm">
            <ui:decorate template="/WEB-INF/components/core/base/tree-table.xhtml" >
                <ui:param name="dataView" value="#{dataView}" />

                <ui:define name="columns">
                    <p:column headerText="#{string['common.name.label']}">
                        <h:outputText value="#{data.party.name}" class="font-bold" />
                    </p:column>
                </ui:define>
                
            </ui:decorate>
        </h:form>
    </ui:define>

    <ui:define name="pager"/>

</ui:composition>
