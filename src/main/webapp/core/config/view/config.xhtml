<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                template="/WEB-INF/templates/child-page.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces">

    <f:metadata>

        <ui:param name="primaryTitle" value="Konfigurasi" />

        <ui:param name="viewPage" value="#{configPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="dataView" value="#{viewPage.configList}" />
        <ui:param name="contentId" value=":data-frm" />  
        <ui:param name="notool" value="true" />

        <ui:param name="filter" value="#{dataView.filter}" />
        <ui:param name="filterType" value="overlay" />
        <ui:param name="filterUi" value="/WEB-INF/components/core/config/filter/config-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/core/config/filter/meta/config-filterui.xhtml" /> 

        <ui:param name="sorter" value="#{dataView.sorter}" />
        <ui:include src="/WEB-INF/components/core/base/meta/sorter.xhtml" />

        <ui:param name="pager" value="#{dataView.pager}" />
        <ui:include src="/WEB-INF/components/core/base/meta/pager.xhtml" />

        <f:viewParam name="s" value="#{dataView.selectionsInternal}" 
                     converter="ConfigListConverter" transient="true" />

    </f:metadata>

    <ui:define name="crud-tools" />
    <ui:define name="crud-context-menu" />

    <ui:define name="content">
        <h:form id="data-frm">
            <ui:include src="/WEB-INF/components/core/config/list/configlist.xhtml" >
                <ui:param name="editable" value="true" />
            </ui:include>
        </h:form>
    </ui:define>

</ui:composition>
